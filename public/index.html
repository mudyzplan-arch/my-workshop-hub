<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUDZYMALL</title>
<style>body{margin:0;font-family:Arial;background:#f5f5f5}header{background:#222;color:#fff;padding:14px;display:flex;gap:10px;align-items:center;position:sticky;top:0}header b{color:#f5a000;font-size:22px}input{flex:1;padding:11px;border-radius:5px;border:0}.cats{display:flex;gap:8px;overflow-x:auto;background:#fff;padding:10px}.cats button{white-space:nowrap;padding:8px 12px;border-radius:20px;border:1px solid #ddd;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}.card{background:#fff;border-radius:8px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover}.card div{padding:10px}.price{color:#e68a00;font-weight:bold;font-size:19px}.btn{display:block;background:#f5a000;text-align:center;padding:12px;font-weight:bold;border-radius:5px;margin-top:8px}</style>
</head><body>
<header><b>MUDZYMALL</b><input id="search" placeholder="Search products..."><a href="/admin" style="color:#fff">Admin</a></header>
<div class="cats" id="cats"></div>
<div style="background:#202020;color:#fff;margin:10px;padding:16px;border-radius:8px"><h2 style="margin:0">Welcome to MUDZYMALLmall</h2><p>Shop everything - Like Kilimall, but yours.</p></div>
<div class="grid" id="grid"></div>
<script>
async function load(){
 let cats=await (await fetch('/api/categories')).json();
 document.getElementById('cats').innerHTML='<button onclick="showAll()">All</button>'+cats.map(c=>`<button onclick="filterCat('${c}')">${c}</button>`).join('');
 let prods=await (await fetch('/api/products')).json();
 window.all=prods; render(prods);
}
function render(list){
 document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><img src="${p.images[0]||'https://via.placeholder.com/300'}"><div><b>${p.name}</b><div class="price">KSh ${p.price.toLocaleString()}</div><div style="color:#888;font-size:13px">${p.category} - Stock: ${p.stock}</div><a class="btn" href="#">Add to Cart</a></div></div>`).join('') || '<p style="padding:20px">No products yet. Go to Admin to add.</p>';
}
function filterCat(c){ render(window.all.filter(p=>p.category===c)); }
function showAll(){ render(window.all); }
document.getElementById('search').oninput=e=>{ let q=e.target.value.toLowerCase(); render(window.all.filter(p=>p.name.toLowerCase().includes(q))); }
load();
</script></body></html>
