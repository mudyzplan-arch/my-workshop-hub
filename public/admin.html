<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - MUDZYMALL</title></head>
<body style="font-family:Arial;padding:16px;max-width:600px;margin:auto">
<h1>MUDZYMALL ADMIN</h1>
<div id="login"><input id="u" placeholder="admin" style="width:100%;padding:12px;margin:5px 0"><input id="p" type="password" placeholder="Password" style="width:100%;padding:12px;margin:5px 0"><button onclick="login()" style="width:100%;padding:14px;background:#f5a000;font-weight:bold">Login Admin</button><p>Default: admin / MUDZYMALLAdmin2026!</p></div>
<div id="panel" style="display:none"><h2>Add Product</h2><input id="name" placeholder="Product Name" style="width:100%;padding:12px;margin:5px 0"><input id="price" type="number" placeholder="Price KSh" style="width:100%;padding:12px;margin:5px 0"><input id="cat" placeholder="Category e.g Electronics" style="width:100%;padding:12px;margin:5px 0"><input id="stock" type="number" placeholder="Stock" style="width:100%;padding:12px;margin:5px 0"><label><input type="checkbox" id="pub" checked> Published</label><br><br><input type="file" id="imgs" multiple accept="image/*"><br><br><button onclick="add()" style="width:100%;padding:14px;background:#222;color:#fff;font-weight:bold">Add Product</button><div id="msg"></div><h2>Dashboard</h2><div id="dash"></div></div>
<script>
async function login(){ let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})}); if(r.ok){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block'; loadDash();} else alert('Wrong login'); }
async function loadDash(){ let d=await (await fetch('/api/admin/dashboard')).json(); document.getElementById('dash').innerHTML=JSON.stringify(d); }
async function add(){ let fd=new FormData(); fd.append('name',document.getElementById('name').value); fd.append('price',document.getElementById('price').value); fd.append('category',document.getElementById('cat').value); fd.append('stock',document.getElementById('stock').value); fd.append('published',document.getElementById('pub').checked); for(let f of document.getElementById('imgs').files) fd.append('images',f); let r=await fetch('/api/admin/products',{method:'POST',body:fd}); document.getElementById('msg').innerText=r.ok?'Product Added!':'Error: '+(await r.text()); }
</script></body></html>
